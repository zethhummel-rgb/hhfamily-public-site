<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>HH Family · Humble Home App</title>
  <script>
    const homepage = new URL(location.protocol === 'file:' ? './index.html' : './', location.href);
    const sections = {
      '#content': '#main',
      '#everyday': '#explore',
      '#google': '#google',
      '#meal-planner': '#meal-planner',
      '#request': '#request',
    };
    if (new URLSearchParams(location.search).get('from') === 'app') homepage.searchParams.set('from', 'app');
    homepage.hash = sections[location.hash] ?? '';
    location.replace(homepage.href);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=./index.html"></noscript>
</head>
<body>
  <p><a href="./index.html">Open the HH Family homepage</a></p>
  <p><a href="./index.html#google">Using Google Calendar with HH</a></p>
</body>
</html>
